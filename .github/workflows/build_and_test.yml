name: Node.js CI

on:
  - push
  - workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install node modules from package.json
        run: |
          if [ -f "./package.json" ]
          then
            npm ci
          fi

      - name: Build
        run: npm run build

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install node modules from package.json
        run: |
          if [ -f "./package.json" ]
          then
            npm ci
          fi

      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install node modules from package.json
        run: |
          if [ -f "./package.json" ]
          then
            npm ci
          fi

      - name: Test
        run: npm run test
        env:
          CI: true
